<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도제반 알림판</title>
<meta name="description" content="경기항공고 로봇자동화과 전자기기생산 L2 도제반 알림판">
<style>
  :root { --bg:#f4f6f8; --ink:#17212b; --muted:#5f6b76; --accent:#d9541e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --ink:#e8edf1; --muted:#9aa6b1; } }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wait { min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px 16px; box-sizing:border-box; }
  .mark { width:52px; height:52px; border-radius:14px; background:#1d2b38; color:#fff; display:grid; place-items:center; font-weight:700; font-size:22px; margin:0 auto 14px; }
  .bar { width:140px; height:4px; border-radius:4px; background:rgba(127,127,127,.2); overflow:hidden; margin:16px auto 0; }
  .bar i { display:block; width:40%; height:100%; background:var(--accent); animation:go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
  p { color:var(--muted); margin:4px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wait" id="wait">
  <div>
    <div class="mark" aria-hidden="true">도</div>
    <b>도제반 알림판</b>
    <p id="msg">불러오는 중입니다…</p>
    <div class="bar" id="bar"><i></i></div>
  </div>
</div>
<script>
/* 이 페이지는 알림판 화면을 웹앱에서 받아 띄우는 입구입니다.
   쿠키 없이 불러오므로 브라우저에 어떤 구글 계정이 로그인되어 있어도 열립니다.
   알림판을 고쳐도 이 파일은 바꿀 필요가 없습니다. */
(function () {
  var API = "https:\/\/script.google.com/macros/s/AKfycbyaTXTXAmoXxjeEebwz63u_1EzDE2C1AtqT7OHvdafUlxa6ZiukZ6BgSgNiKmuhScDP/exec";
  function fail() {
    document.getElementById("bar").style.display = "none";
    document.getElementById("msg").innerHTML = "알림판을 불러오지 못했습니다. 인터넷 연결을 확인하고 <a href=\"\" onclick=\"location.reload();return false\">다시 시도</a>해 주세요.";
  }
  fetch(API + "?raw=1", { credentials: "omit", cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf("<html") < 0) throw new Error("bad");
      var inject = "<script>window.DOJEBAN_API=" + JSON.stringify(API) + ";<\/script>";
      html = html.replace(/<head([^>]*)>/i, "<head$1>" + inject);
      document.open(); document.write(html); document.close();
    })
    .catch(fail);
})();
</script>
</body>
</html>
