<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도제반 알림판</title>
<meta name="description" content="경기항공고 로봇자동화과 전자기기생산 L2 도제반 알림판">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16232f">
<meta name="apple-mobile-web-app-title" content="도제반">
<style>
  :root { --bg:#f4f6f8; --ink:#17212b; --muted:#5f6b76; --accent:#d9541e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181c; --ink:#e8edf1; --muted:#9aa6b1; } }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wait { min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px 16px; box-sizing:border-box; }
  .mark { width:52px; height:52px; border-radius:14px; background:#1d2b38; color:#fff; display:grid; place-items:center; font-weight:700; font-size:22px; margin:0 auto 14px; }
  .bar { width:140px; height:4px; border-radius:4px; background:rgba(127,127,127,.2); overflow:hidden; margin:16px auto 0; }
  .bar i { display:block; width:40%; height:100%; background:var(--accent); animation:go 1.1s ease-in-out infinite; }
  @keyframes go { from { transform:translateX(-100%); } to { transform:translateX(250%); } }
  p { color:var(--muted); margin:4px 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="wait" id="wait">
  <div>
    <div class="mark" aria-hidden="true">도</div>
    <b>도제반 알림판</b>
    <p id="msg">불러오는 중입니다…</p>
    <div class="bar" id="bar"><i></i></div>
  </div>
</div>
<script>
/* 이 페이지는 알림판 화면을 웹앱에서 받아 띄우는 입구입니다.
   쿠키 없이 불러오므로 브라우저에 어떤 구글 계정이 로그인되어 있어도 열립니다.
   알림판을 고쳐도 이 파일은 바꿀 필요가 없습니다. */
(function () {
  var API = "https:\/\/script.google.com/macros/s/AKfycbyaTXTXAmoXxjeEebwz63u_1EzDE2C1AtqT7OHvdafUlxa6ZiukZ6BgSgNiKmuhScDP/exec";
  /* 진행 표시: 어느 단계에서 멈췄는지 보이도록 단계와 경과 시간을 적습니다. */
  var T0=Date.now(),stage="화면 코드 받는 중",done=false,tick=setInterval(function(){if(done){clearInterval(tick);return;}var el=document.getElementById("msg");if(el)el.textContent=stage+" · "+((Date.now()-T0)/1000).toFixed(1)+"초";},200);
  function setStage(t){stage=t;}
  function fail(e) {
    done=true;
    document.getElementById("bar").style.display = "none";
    document.getElementById("msg").innerHTML = "알림판을 불러오지 못했습니다(" + String((e&&e.message)||e||"알 수 없음").replace(/[&<>]/g,"") + ", " + stage + "). 인터넷 연결을 확인하고 <a href=\"\" onclick=\"location.reload();return false\">다시 시도</a>해 주세요. 계속되면 이 화면을 캡처해 선생님께 보내 주세요.";
  }
  window.addEventListener("error",function(e){if(!done)fail(e.message||"화면 오류");});
  /* 초기 데이터는 화면 코드와 동시에 요청합니다. 결과는 메모리에서 한 번만 사용합니다. */
  var saved = {}; try { saved = JSON.parse(localStorage.getItem("dj.cred") || "null") || {}; } catch (e) {}
  window.DOJEBAN_BOOT = { started: Date.now(), homeOnly: true, credential: JSON.stringify(saved), promise:
    fetch(API, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: "api", req: { action: "load", payload: { deferLinks: true, homeOnly: true }, cred: saved, withLoad: false } }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (response) { return { response: response }; }).catch(function () { return {}; }) };
  /* 캐시에는 서버가 보내는 정적 화면 코드만 보관합니다. load 응답·학생 자료·인증값은 넣지 않습니다. */
  var KEY="dj.ui.shell.v1",cached=null;
  function valid(html){return typeof html==="string"&&html.length<1500000&&html.indexOf('data-ui-shell="v1"')>=0&&html.indexOf('data-home-boot="v1"')>=0&&html.indexOf('function setData(')>=0&&html.indexOf('id="shell"')>=0;}
  try{var c=JSON.parse(localStorage.getItem(KEY)||"null");if(c&&c.api===API&&c.at<=Date.now()&&Date.now()-c.at<86400000&&valid(c.html))cached=c;}catch(ignore){}
  /* 저장된 화면은 이 스크립트가 아직 읽히는 도중에 쓰이면 기존 '불러오는 중' 화면 아래에 덧붙여집니다(내용이 화면 밖으로 밀려 로딩만 보임).
     그래서 페이지 읽기가 끝난 뒤 문서를 통째로 바꾸고, 혹시 남는 대기 화면은 지웁니다. */
  function show(html){
      if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){setTimeout(function(){showNow(html);},0);},{once:true});return;}
      showNow(html);
  }
  function showNow(html){
      var w=document.getElementById("wait");if(w&&w.parentNode)w.parentNode.removeChild(w);
      /* 알림판 화면으로 바뀐 뒤에도 즐겨찾기·홈 화면 아이콘이 유지되도록 아이콘 태그를 함께 넣음 */
      var icons = '<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16232f"><meta name="apple-mobile-web-app-title" content="도제반">';
      var inject = icons + "<script>window.DOJEBAN_API=" + JSON.stringify(API) + ";<\/script>";
      html = html.replace(/<head([^>]*)>/i, "<head$1>" + inject);
      done=true; setStage("화면 여는 중");
      document.open(); document.write(html); document.close();
      /* 화면을 띄운 뒤 사용자가 손대기 시작했는지 기억합니다(옛 화면 자동 교체 여부 판단). */
      window.__djTouched=false;["pointerdown","keydown","touchstart"].forEach(function(t){window.addEventListener(t,function(){window.__djTouched=true;},{capture:true,once:true});});
  }
  /* 화면 코드는 GitHub Pages의 app.html(웹앱에서 5분마다 받아 둠)을 먼저 읽습니다. 웹앱 ?raw=1은 10초 이상 걸려서 app.html이 없거나 깨졌을 때만 씁니다. */
  function withTimeout(p,ms,label){return new Promise(function(ok,no){var t=setTimeout(function(){no(new Error(label+" 시간 초과"));},ms);p.then(function(v){clearTimeout(t);ok(v);},function(e){clearTimeout(t);no(e);});});}
  function getScreen(url, opt, ms){return withTimeout(fetch(url, opt),ms||10000,url.indexOf("raw=1")>=0?"웹앱 화면":"app.html").then(function(r){if(!r.ok)throw new Error(r.status);return r.text();}).then(function(html){if(!valid(html))throw new Error("bad screen");return html;});}
  function keep(html){try{localStorage.setItem(KEY,JSON.stringify({api:API,at:Date.now(),html:html}));}catch(ignore){}return html;}
  function appHtml(){return getScreen("app.html", { cache: "no-cache" });}
  function rawHtml(){setStage("예비 경로(웹앱)로 화면 받는 중");return getScreen(API + "?raw=1", { credentials: "omit", cache: "no-store" }, 40000);}
  function readFresh(){return appHtml().catch(rawHtml).then(keep);}
  /* 화면 코드의 버전(dj-build)과 서버가 알려 주는 버전(build)을 비교합니다.
     배포 직후 app.html이 아직 옛 버전이면 기다리지 않고 웹앱에서 새 화면을 바로 받아 '새 화면 버전 적용'을 띄웁니다. */
  function buildOf(html){var m=String(html||"").match(/<meta name="dj-build" content="([^"]*)">/);return m?m[1]:"";}
  function newest(build){return appHtml().then(function(h){return buildOf(h)===build?h:rawHtml();}).catch(rawHtml).then(function(h){if(buildOf(h)===build)keep(h);return h;});}
  function offer(){var add=function(){if(document.getElementById("screenUpdate"))return;var box=document.createElement("div");box.id="screenUpdate";box.style.cssText="position:fixed;bottom:16px;right:16px;z-index:30;background:#fff;color:#17212b;border:1px solid #d7dee6;border-radius:10px;padding:12px;box-shadow:0 4px 18px #0002;max-width:calc(100vw - 56px)";var button=document.createElement("button");button.type="button";button.className="btn sm";button.textContent="새 화면 버전 적용 (새로고침)";button.onclick=function(){location.reload();};box.appendChild(button);document.body.appendChild(box);};if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",add,{once:true});else add();}
  var bootPromise=window.DOJEBAN_BOOT.promise; /* 화면이 시작하면서 DOJEBAN_BOOT를 비우므로 미리 잡아 둠 */
  var current=cached?cached.html:"";
  var screenReady=cached?Promise.resolve(cached.html):readFresh();
  if(cached){try{show(cached.html);}catch(e){done=false;try{localStorage.removeItem(KEY);}catch(ignore){}fail(e);}}else screenReady.then(function(h){current=h;show(h);}).catch(fail);
  /* 재방문 시 첫 데이터 응답 뒤에 화면 업데이트를 확인해 초기 요청과 겹치지 않습니다. */
  screenReady.then(function(){return bootPromise;}).then(function(boot){
    var res=boot&&boot.response,build=res&&res.data&&res.data.build;
    if(build){ if(buildOf(current)===build)return; return newest(build).then(function(h){if(buildOf(h)!==build||h===current)return;
      /* 다른 AI·사람이 배포한 직후 app.html이 아직 옛 버전이면, 손대기 전(20초 안)에는 새 화면으로 바로 바꾸고 그 뒤면 버튼으로 알립니다. */
      if(!window.__djTouched&&Date.now()-T0<20000){current=h;showNow(h);}else offer();}); }
    if(cached)return readFresh().then(function(h){if(h!==cached.html)offer();});
  }).catch(function(){});

})();
</script>
</body>
</html>
